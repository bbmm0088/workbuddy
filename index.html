<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝宝学习工作台</title>
<style>
/* ============ [1] 主题变量与基础 ============ */
:root{
  --bg:#f0f9ee; --bg2:#e7f5e1; --card:#ffffff; --primary:#5cb85c; --primary-d:#449d44;
  --sky:#5bc0de; --sky-d:#31b0d5; --orange:#f0ad4e; --orange-d:#ec971f;
  --pink:#ff8fb1; --pink-d:#f06292; --purple:#b39ddb; --purple-d:#9575cd;
  --danger:#e74c3c; --danger-d:#c0392b; --gold:#ffd54f; --brown:#a1887f;
  --text:#3a3a3a; --text-soft:#6b6b6b; --text-light:#9e9e9e; --border:#e0e7dd;
  --radius:18px; --radius-sm:12px; --shadow:0 4px 16px rgba(92,184,92,.18);
  --shadow-hover:0 8px 24px rgba(92,184,92,.28);
  --grass1:#7cb342; --grass2:#689f38; --grass3:#558b2f;
  --font:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--font);background:linear-gradient(135deg,#f0f9ee 0%,#e3f2fd 100%);color:var(--text);overflow:hidden;font-size:14px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ [2] 布局 ============ */
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;}
.topbar{background:linear-gradient(90deg,var(--primary),var(--sky));color:#fff;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:10;min-height:56px;}
.topbar .logo{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.topbar .stats{display:flex;gap:8px;flex:1;flex-wrap:wrap;align-items:center;}
.stat-chip{background:rgba(255,255,255,.22);border-radius:20px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.stat-chip b{font-size:13px;}
.progress-wrap{flex:1;min-width:140px;max-width:260px;}
.progress-bar{background:rgba(255,255,255,.3);border-radius:10px;height:16px;overflow:hidden;position:relative;}
.progress-fill{background:linear-gradient(90deg,#ffd54f,#ffb300);height:100%;border-radius:10px;transition:width .4s;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#5d4037;}
.mode-toggle{background:rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;font-size:12px;color:#fff;font-weight:600;}
.mode-toggle.parent{background:rgba(231,76,60,.7);}

.main-area{display:grid;grid-template-columns:auto 1fr;overflow:hidden;}
.sidebar{background:var(--card);border-right:2px solid var(--bg2);padding:10px 8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;width:84px;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:var(--radius-sm);background:var(--bg);color:var(--text-soft);font-size:11px;font-weight:600;transition:all .2s;min-height:60px;justify-content:center;}
.nav-btn .ico{font-size:22px;line-height:1;}
.nav-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;box-shadow:var(--shadow);transform:scale(1.02);}
.nav-btn:hover:not(.active){background:var(--bg2);}
.content{overflow-y:auto;padding:16px;}
.bottombar{background:var(--card);border-top:2px solid var(--bg2);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-soft);min-height:36px;}

/* ============ [3] 组件 ============ */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.card-title{font-size:16px;font-weight:700;color:var(--primary-d);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all .2s;background:var(--primary);color:#fff;}
.btn:hover{background:var(--primary-d);transform:translateY(-1px);}
.btn.sky{background:var(--sky);} .btn.sky:hover{background:var(--sky-d);}
.btn.orange{background:var(--orange);} .btn.orange:hover{background:var(--orange-d);}
.btn.pink{background:var(--pink);} .btn.pink:hover{background:var(--pink-d);}
.btn.danger{background:var(--danger);} .btn.danger:hover{background:var(--danger-d);}
.btn.ghost{background:var(--bg);color:var(--text-soft);} .btn.ghost:hover{background:var(--bg2);color:var(--text);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{background:#ccc !important;color:#999 !important;cursor:not-allowed;transform:none !important;}
.btn.done{background:#a5d6a7 !important;color:#2e7d32 !important;}

.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
.task-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border:2px solid transparent;transition:all .2s;}
.task-card.done{border-color:var(--primary);background:#f1f8e9;}
.task-card .t-title{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.task-card .t-desc{font-size:12px;color:var(--text-soft);flex:1;}
.task-card .t-foot{display:flex;justify-content:space-between;align-items:center;}
.reward-tag{background:var(--gold);color:#5d4037;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px;}
.modal{background:var(--card);border-radius:var(--radius);padding:20px;max-width:600px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.modal-title{font-size:18px;font-weight:700;color:var(--primary-d);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:var(--bg);border-radius:50%;width:30px;height:30px;font-size:18px;color:var(--text-soft);}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:200;animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-10px);}to{opacity:1;transform:translate(-50%,0);}}

/* 答题 */
.quiz-box{display:flex;flex-direction:column;gap:14px;}
.quiz-q{font-size:18px;font-weight:600;background:var(--bg);padding:14px;border-radius:var(--radius-sm);line-height:1.6;}
.quiz-ans{display:flex;gap:12px;flex-wrap:wrap;}
.quiz-ans input{flex:1;min-width:120px;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:18px;}
.quiz-ans input:focus{border-color:var(--primary);}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.opt-btn{padding:14px;border-radius:var(--radius-sm);background:var(--bg);font-size:17px;font-weight:600;border:2px solid transparent;line-height:1.4;}
.opt-btn:hover{background:var(--bg2);}
.opt-btn.sel{background:var(--sky);color:#fff;}
.opt-btn.correct{background:var(--primary);color:#fff;}
.opt-btn.wrong{background:var(--danger);color:#fff;}

/* 花园 */
.garden-wrap{background:linear-gradient(180deg,#a5d6a7,#81c784);border-radius:var(--radius);padding:12px;}
.garden-grid{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr);gap:3px;aspect-ratio:9/5;}
.cell{background:repeating-linear-gradient(90deg,var(--grass1) 0 50%,var(--grass2) 50% 100%);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;position:relative;transition:transform .15s;min-height:34px;}
.cell:hover{transform:scale(1.08);z-index:2;box-shadow:0 0 8px rgba(0,0,0,.2);}
.cell.has-plant{background:repeating-linear-gradient(90deg,#aed581 0 50%,#9ccc65 50% 100%);}
.cell .hp-bar{position:absolute;bottom:1px;left:2px;right:2px;height:3px;background:rgba(0,0,0,.2);border-radius:2px;}
.cell .hp-bar i{display:block;height:100%;background:#ff5252;border-radius:2px;}
.zombie-row{display:flex;justify-content:flex-start;gap:4px;padding:4px;margin-top:6px;min-height:50px;align-items:center;flex-wrap:wrap;}
.zombie{background:rgba(74,74,74,.85);border-radius:8px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#fff;min-width:50px;position:relative;animation:zWalk .8s ease;}
@keyframes zWalk{0%{transform:translateY(-6px);}100%{transform:translateY(0);}}
.zombie .z-emoji{font-size:24px;}
.zombie .z-hp{font-size:10px;}
.zombie .z-bar{width:34px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;}
.zombie .z-bar i{display:block;height:100%;background:#76ff03;border-radius:2px;}
/* 僵尸在花园网格内 */
.cell-zombie{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;cursor:pointer;z-index:3;pointer-events:auto;}
.cell-zombie .z-bar{width:80%;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:2px;}
.cell-zombie .z-bar i{display:block;height:100%;background:#76ff03;border-radius:2px;}
.cell-zombie .z-hp{font-size:9px;color:#fff;text-shadow:0 0 2px #000;font-weight:700;}
.cell-zombie-img{width:100%;height:100%;max-width:none;object-fit:contain;pointer-events:none;animation:zWalk .8s ease;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));position:absolute;top:0;left:0;}
.cell:has(.cell-zombie){background:repeating-linear-gradient(90deg,#616161 0 50%,#424242 50% 100%) !important;}
/* 植物和僵尸图片样式 */
.cell-plant-img{width:90%;max-height:90%;object-fit:contain;pointer-events:none;animation:plantSway 3s ease-in-out infinite;transform-origin:bottom center;}
.cell-plant-emoji{font-size:22px;pointer-events:none;}
.cell-zombie-img{width:100%;height:100%;object-fit:contain;pointer-events:none;animation:zWalk .8s ease;}
@keyframes plantSway{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}

/* 宠物 */
.pet-card{background:linear-gradient(135deg,#fff3e0,#ffe0b2);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;}
.pet-emoji{font-size:48px;text-align:center;}
.pet-img{width:100%;max-width:140px;height:140px;border-radius:50%;object-fit:cover;margin:0 auto;display:block;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .3s;}
.pet-img:hover{transform:scale(1.05);}
.bar-wrap{background:#fff;border-radius:10px;height:14px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:10px;transition:width .4s;}
.bar-fill.sat{background:linear-gradient(90deg,#ffb300,#ff8f00);}
.bar-fill.int{background:linear-gradient(90deg,#ec407a,#e91e63);}
.bar-label{font-size:11px;color:var(--text-soft);display:flex;justify-content:space-between;}
.status-tag{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700;align-self:flex-start;}
.status-tag.healthy{background:#c8e6c9;color:#2e7d32;}
.status-tag.hungry{background:#fff9c4;color:#f57f17;}
.status-tag.sick{background:#ffcdd2;color:#c62828;}
.status-tag.dead{background:#b71c1c;color:#fff;}

/* 商店 */
.shop-card{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);}
.shop-card .price{color:var(--orange-d);font-weight:700;font-size:18px;}
.shop-card .s-icon{font-size:40px;}

/* 成就 */
.badge{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);position:relative;}
.badge.locked{filter:grayscale(1);opacity:.55;}
.badge .b-icon{font-size:40px;}
.badge.unlocked .b-icon{animation:shine 2s infinite;}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 0 transparent);}50%{filter:drop-shadow(0 0 6px var(--gold));}}

/* 日志 */
.log-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bg);font-size:12px;}
.log-time{color:var(--text-light);font-size:11px;}
.log-delta.pos{color:var(--primary-d);font-weight:700;}
.log-delta.neg{color:var(--danger);font-weight:700;}

/* 笔顺动画 */
.stroke-demo{font-size:80px;text-align:center;font-family:'KaiTi','STKaiti',serif;color:var(--primary-d);animation:strokePulse 2s ease infinite;}
@keyframes strokePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

/* 阳光飘字 */
.sun-float{position:fixed;color:var(--gold);font-weight:700;font-size:22px;pointer-events:none;z-index:300;text-shadow:0 0 4px #fff;animation:floatUp 1.2s ease forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}

/* 表单 */
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-row label{font-size:12px;color:var(--text-soft);font-weight:600;}
.form-row input,.form-row select{padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;}

/* ============ [4] 响应式 ============ */
@media(max-width:768px){
  .topbar{font-size:12px;padding:6px 10px;gap:6px;}
  .topbar .logo{font-size:13px;}
  .stat-chip{font-size:11px;padding:3px 7px;}
  .main-area{grid-template-columns:1fr;grid-template-rows:1fr auto;}
  .sidebar{flex-direction:row;width:100%;overflow-x:auto;border-right:none;border-top:2px solid var(--bg2);padding:6px;gap:4px;order:2;}
  .nav-btn{min-width:62px;min-height:54px;flex-shrink:0;}
  .content{order:1;padding:10px;}
  .bottombar{font-size:11px;padding:6px 10px;}
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .modal{padding:14px;margin:8px;}
}
@media(max-width:480px){
  .garden-grid .cell{font-size:16px;}
  .pet-emoji{font-size:36px;}
  .stat-chip b{font-size:12px;}
}

.tooltip{position:absolute;background:rgba(0,0,0,.82);color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;z-index:50;pointer-events:none;max-width:180px;white-space:normal;}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部状态栏 -->
  <header class="topbar">
    <div class="logo">🌻 宝宝学习工作台</div>
    <div class="stats" id="topStats"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="topProgress" style="width:0%">0%</div></div>
    </div>
    <button class="mode-toggle" id="modeBtn" onclick="App.toggleMode()">👶 孩子模式</button>
  </header>

  <!-- 主区域 -->
  <div class="main-area">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>

  <!-- 底部 -->
  <footer class="bottombar">
    <span id="footLeft">© WorkBuddy 儿童智能学习工作台</span>
    <span id="footRight"></span>
  </footer>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ====================================================================
 * WorkBuddy 儿童智能学习工作台 - 单文件应用
 * 模块：Store / State / Bank / Reset / Garden / Pet / Shop / Ach / Log / Audio / Sync / Router / UI
 * ==================================================================== */
(function(){
'use strict';

/* ============ 工具函数 ============ */
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const todayStr = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const nowISO = ()=>new Date().toISOString();
const rnd = (n)=>Math.floor(Math.random()*n);
const pick = (arr,n)=>{const c=[...arr];const r=[];for(let i=0;i<n&&c.length;i++){r.push(c.splice(rnd(c.length),1)[0]);}return r;};
const shuffle = (arr)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

function toast(msg,ms=1800){const r=$('#toastRoot');const t=document.createElement('div');t.className='toast';t.textContent=msg;r.appendChild(t);setTimeout(()=>t.remove(),ms);}
function sunFloat(x,y,txt){const f=document.createElement('div');f.className='sun-float';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1200);}
// 语音朗读（Web Speech API）— 增强版：确保语音已加载，兼容移动端
let _voicesReady=false;
function _loadVoices(){
  if(!('speechSynthesis'in window))return;
  const v=window.speechSynthesis.getVoices();
  if(v&&v.length>0)_voicesReady=true;
}
if('speechSynthesis'in window){
  _loadVoices();
  window.speechSynthesis.onvoiceschanged=()=>{_loadVoices();};
}
function speak(text,lang){
  try{
    if(!('speechSynthesis'in window)){toast('当前浏览器不支持语音朗读');return;}
    if(!text||!text.trim())return;
    window.speechSynthesis.cancel();
    _loadVoices();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||(/[\u4e00-\u9fa5]/.test(text)?'zh-CN':'en-US');
    u.rate=0.85;u.pitch=1.1;u.volume=1;
    // 尝试匹配对应语言的语音引擎
    const voices=window.speechSynthesis.getVoices()||[];
    const match=voices.find(v=>v.lang===u.lang)||voices.find(v=>v.lang.startsWith(u.lang.split('-')[0]));
    if(match)u.voice=match;
    u.onerror=function(e){console.warn('speak error',e);};
    window.speechSynthesis.speak(u);
    // 某些浏览器需要 resume 唤醒
    if(window.speechSynthesis.paused)window.speechSynthesis.resume();
  }catch(e){console.warn('speak fail',e);toast('朗读失败，请重试');}
}

/* ============ Store 模块 ============ */
const Store = {
  KEY:'wb_data_v1',
  data:null,
  load(){
    try{const raw=localStorage.getItem(this.KEY);this.data=raw?JSON.parse(raw):null;}catch(e){this.data=null;}
    if(!this.data) this.data=this.defaultData();
    this.migrate();
    return this.data;
  },
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.data));Sync.broadcast();}catch(e){console.warn('save fail',e);}},
  migrate(){
    const d=this.data;
    if(!d.version) d.version='1.0';
    if(!d.settings) d.settings={};
    if(!d.settings.parentPassword) d.settings.parentPassword='8888';
    if(d.settings.zombieEnabled===undefined) d.settings.zombieEnabled=true;
    if(d.settings.petDecayEnabled===undefined) d.settings.petDecayEnabled=true;
    if(!d.settings.lastResetDate) d.settings.lastResetDate=todayStr();
    if(!d.settings.currentChildId) d.settings.currentChildId=Object.keys(d.children)[0]||'';
    if(!d.shopItems) d.shopItems=Shop.defaultItems();
    if(!d.plantDefs) d.plantDefs=Garden.defaultDefs();
    else{
      // 合并植物定义：确保已有植物的 img 字段被更新（兼容旧数据）
      const pDefs=Garden.defaultDefs();
      Object.keys(pDefs).forEach(k=>{
        if(!d.plantDefs[k]) d.plantDefs[k]=pDefs[k];
        else{
          // 强制更新所有字段（cost/desc/attack/bomb/img等），确保新配置生效
          const old=d.plantDefs[k];
          Object.keys(pDefs[k]).forEach(f=>{
            old[f]=pDefs[k][f];
          });
        }
      });
    }
    // 合并宠物定义：确保已有宠物的 img 字段被更新（兼容旧数据）
    if(!d.petDefs) d.petDefs=Pet.defaultDefs();
    else{
      const defs=Pet.defaultDefs();
      Object.keys(defs).forEach(k=>{
        if(!d.petDefs[k]) d.petDefs[k]=defs[k];
        else{
          // 强制更新基础 img 字段
          d.petDefs[k].img=defs[k].img;
          // 强制更新 imgs 状态图（确保新图片路径生效）
          if(defs[k].imgs){
            if(!d.petDefs[k].imgs)d.petDefs[k].imgs={};
            Object.keys(defs[k].imgs).forEach(state=>{
              d.petDefs[k].imgs[state]=defs[k].imgs[state];
            });
          }
        }
      });
    }
    if(!d.achievementDefs) d.achievementDefs=Ach.defaultDefs();
    if(d.settings.reviewMode===undefined) d.settings.reviewMode=false;
    if(!d.settings.hiddenTasks) d.settings.hiddenTasks=[];

        {title:'望天门山',author:'李白',content:'天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。',pinyin:'tiān mén zhōng duàn chǔ jiāng kāi,bì shuǐ dōng liú zhì cǐ huí。liǎng àn qīng shān xiāng duì chū,gū fān yī piàn rì biān lái。',analysis:'描绘长江流经天门山的壮阔景象。'},
        {title:'饮湖上初晴后雨',author:'苏轼',content:'水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。',pinyin:'shuǐ guāng liàn yàn qíng fāng hǎo,shān sè kōng méng yǔ yì qí。yù bǎ xī hú bǐ xī zǐ,dàn zhuāng nóng mǒ zǒng xiāng yí。',analysis:'以美人喻西湖，晴雨皆美，比喻新颖。'},
        {title:'元日',author:'王安石',content:'爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。',pinyin:'bào zhú shēng zhōng yī suì chú,chūn fēng sòng nuǎn rù tú sū。qiān mén wàn hù tóng tóng rì,zǒng bǎ xīn táo huàn jiù fú。',analysis:'写春节热闹景象，"新桃换旧符"寓意辞旧迎新。'},
        {title:'清明',author:'杜牧',content:'清明时节雨纷纷，路上行人欲断魂。借问酒家何处有？牧童遥指杏花村。',pinyin:'qīng míng shí jié yǔ fēn fēn,lù shàng xíng rén yù duàn hún。jiè wèn jiǔ jiā hé chù yǒu？mù tóng yáo zhǐ xìng huā cūn。',analysis:'写清明雨景与行人愁思，"遥指杏花村"余味无穷。'}

        {title:'望洞庭',author:'刘禹锡',content:'湖光秋月两相和，潭面无风镜未磨。遥望洞庭山水翠，白银盘里一青螺。',pinyin:'hú guāng qiū yuè liǎng xiāng hé,tán miàn wú fēng jìng wèi mó。yáo wàng dòng tíng shān shuǐ cuì,bái yín pán lǐ yī qīng luó。',analysis:'以白银盘青螺喻洞庭山水，比喻奇巧。'},
        {title:'忆江南',author:'白居易',content:'江南好，风景旧曾谙。日出江花红胜火，春来江水绿如蓝。能不忆江南？',pinyin:'jiāng nán hǎo,fēng jǐng jiù céng ān。rì chū jiāng huā hóng shèng huǒ,chūn lái jiāng shuǐ lǜ rú lán。néng bù yì jiāng nán？',analysis:'追忆江南春色，色彩鲜明。'},
        {title:'浪淘沙',author:'刘禹锡',content:'九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。',pinyin:'jiǔ qū huáng hé wàn lǐ shā,làng táo fēng bǒ zì tiān yá。rú jīn zhí shàng yín hé qù,tóng dào qiān niú zhī nǚ jiā。',analysis:'写黄河雄浑气势，想象奔放，直上银河浪漫瑰丽。'},
        {title:'江雪',author:'柳宗元',content:'千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。',pinyin:'qiān shān niǎo fēi jué,wàn jìng rén zōng miè。gū zhōu suō lì wēng,dú diào hán jiāng xuě。',analysis:'写雪中孤舟独钓，"绝""灭"二字写出天地寂寥，意境孤高。'}

        {title:'渔歌子',author:'张志和',content:'西塞山前白鹭飞，桃花流水鳜鱼肥。青箬笠，绿蓑衣，斜风细雨不须归。',pinyin:'xī sài shān qián bái lù fēi,táo huā liú shuǐ guì yú féi。qīng ruò lì,lǜ suō yī,xié fēng xì yǔ bù xū guī。',analysis:'写江南水乡渔父生活，意境优美。'},
        {title:'泊船瓜洲',author:'王安石',content:'京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还。',pinyin:'jīng kǒu guā zhōu yī shuǐ jiān,zhōng shān zhǐ gé shù chóng shān。chūn fēng yòu lǜ jiāng nán àn,míng yuè hé shí zhào wǒ huán。',analysis:'"绿"字传神，写思乡之情。'},
        {title:'秋思',author:'张籍',content:'洛阳城里见秋风，欲作家书意万重。复恐匆匆说不尽，行人临发又开封。',pinyin:'luò yáng chéng lǐ jiàn qiū fēng,yù zuò jiā shū yì wàn chóng。fù kǒng cōng cōng shuō bù jìn,xíng rén lín fā yòu kāi fēng。',analysis:'写思乡写信之细，"又开封"写出万千牵挂。'},

        {title:'水调歌头',author:'苏轼',content:'明月几时有？把酒问青天。不知天上宫阙，今夕是何年。但愿人长久，千里共婵娟。',pinyin:'míng yuè jǐ shí yǒu？bǎ jiǔ wèn qīng tiān。bù zhī tiān shàng gōng què,jīn xī shì hé nián。dàn yuàn rén cháng jiǔ,qiān lǐ gòng chán juān。',analysis:'中秋怀人名作，"千里共婵娟"传诵千古。'},

        {title:'卜算子·送鲍浩然之浙东',author:'王观',content:'水是眼波横，山是眉峰聚。欲问行人去那边？眉眼盈盈处。才始送春归，又送君归去。若到江南赶上春，千万和春住。',pinyin:'shuǐ shì yǎn bō héng,shān shì méi fēng jù。yù wèn xíng rén qù nà biān？méi yǎn yíng yíng chù。cái shǐ sòng chūn guī,yòu sòng jūn guī qù。ruò dào jiāng nán gǎn shàng chūn,qiān wàn hé chūn zhù。',analysis:'以眉眼喻山水，构思巧妙，送别中含惜春之情。'},
        {title:'己亥杂诗',author:'龚自珍',content:'九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才。',pinyin:'jiǔ zhōu shēng qì shì fēng léi,wàn mǎ qí yīn jiū kě āi。wǒ quàn tiān gōng chóng dǒu sǒu,bù jū yī gé jiàng rén cái。',analysis:'期盼社会变革，"不拘一格降人才"振聋发聩。'}

/* ============ Audio 音效（Web Audio合成）============ */
const Audio = {
  ctx:null,
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}},
  play(type){
    this.init();if(!this.ctx)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    const c=this.ctx;const now=c.currentTime;
    const beep=(freq,start,dur,wave='sine',vol=0.15)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type=wave;o.frequency.value=freq;
      o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(0,now+start);
      g.gain.linearRampToValueAtTime(vol,now+start+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,now+start+dur);
      o.start(now+start);o.stop(now+start+dur);
    };
    const seq={plant:[['523',0,0.1],['659',0.1,0.1],['784',0.2,0.15]],
      checkin:[['659',0,0.08],['880',0.08,0.1],['1047',0.16,0.12]],
      correct:[['523',0,0.1],['784',0.1,0.15]],
      wrong:[['400',0,0.1],['300',0.1,0.1],['200',0.2,0.15]],
      sunlight:[['880',0,0.08],['1100',0.08,0.1]],
      pet:[['660',0,0.1],['880',0.1,0.1],['660',0.2,0.1]],
      zombie:[['150',0,0.2,'sawtooth']],
      badge:[['523',0,0.1],['659',0.1,0.1],['784',0.2,0.1],['1047',0.3,0.2]],
      redeem:[['784',0,0.1],['1047',0.1,0.1],['1319',0.2,0.2]]
    }[type]||[['440',0,0.1]];
    seq.forEach(s=>beep(s[0],s[1],s[2],s[3]||'sine'));
  }
};

/* ============ Logger 日志 ============ */
const Log = {
  sunlight(action,delta){
    const c=curChild();
    c.sunlight.total=Math.max(0,c.sunlight.total+delta);
    c.logs.sunlight.unshift({time:nowISO(),action,delta,balance:c.sunlight.total});
    if(c.logs.sunlight.length>500)c.logs.sunlight.length=500;
  },
  pet(action,petId,detail){
    const c=curChild();
    c.logs.pet.unshift({time:nowISO(),action,petId,detail});
    if(c.logs.pet.length>300)c.logs.pet.length=300;
  }
};

/* ============ 阳光操作 ============ */
function addSunlight(amount,reason){
  const c=curChild();
  c.today.sunlight+=amount;
  Log.sunlight(reason,amount);
  Audio.play('sunlight');
  Store.save();
}
function spendSunlight(amount,reason){
  const c=curChild();
  if(c.sunlight.total<amount)return false;
  Log.sunlight(reason,-amount);  // Log内部会扣减total并记日志
  Store.save();
  return true;
}

    };
  },
  plantList(){return Store.data.plantDefs;},
  canPlant(type){
    const def=this.plantList()[type];if(!def)return false;
    return curChild().sunlight.total>=def.cost;
  },
  plant(row,col,type){
    const c=curChild();const def=this.plantList()[type];if(!def)return false;
    if(c.garden.grid[row][col])return false;
    if(!spendSunlight(def.cost,'种植'+def.name))return false;
    // 樱桃炸弹：种植立即爆炸，炸毁周围3x3范围所有僵尸，炸弹自身消失
    if(def.bomb){
      Audio.play('plant');
      const before=c.garden.zombies.length;
      if(before>0){
        // 计算3x3范围所有格子索引
        const bombTiles=new Set();
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const nr=row+dr,nc=col+dc;
          if(nr>=0&&nr<5&&nc>=0&&nc<9)bombTiles.add(nr*9+nc);
        }
        c.garden.zombies=c.garden.zombies.filter(z=>{
          const zr=z.row!==undefined?z.row:0;
          return !bombTiles.has(zr*9+z.pos);
        });
        const killed=before-c.garden.zombies.length;
        if(killed>0){
          c.logs.sunlight.unshift({time:nowISO(),action:`🍒 樱桃炸弹爆炸，炸飞 ${killed} 只僵尸！`,delta:0,balance:c.sunlight.total});
          toast(`🍒 爆炸！炸飞 ${killed} 只僵尸！`,'🎉');
        }else{
          toast('🍒 樱桃炸弹爆炸！周围没有僵尸');
        }
      }else{
        toast('🍒 樱桃炸弹爆炸！周围没有僵尸');
      }
      Audio.play('zombie');
      Store.save();
      return true;
    }
    c.garden.grid[row][col]={type,plantedAt:nowISO(),hp:def.block?200:100};
    Audio.play('plant');Store.save();return true;
  },
  remove(row,col){
    const c=curChild();const cell=c.garden.grid[row][col];if(!cell)return;
    const def=this.plantList()[cell.type];
    let cost=0;
    if(c.garden.undoFree){c.garden.undoFree=false;}
    else{cost=10;if(!spendSunlight(10,'撤销种植'+def.name)){toast('阳光不足，无法撤销');return false;}}
    c.garden.grid[row][col]=null;
    // 退回植物本身费用（Log.sunlight内部会加回total并记日志）
    Log.sunlight('退还'+def.name,def.cost);
    c.today.sunlight+=def.cost;
    Store.save();return true;
  },
};
// 每日结算：产阳光+攻击僵尸+僵尸移动（遍历所有孩子时使用，日志直接写入对应孩子）
function gardenSettleFor(c){
  const defs=Garden.plantList();
  let produce=0,totalAttack=0,hasWallnut=false;
  for(let r=0;r<5;r++)for(let col=0;col<9;col++){
    const cell=c.garden.grid[r][col];if(!cell)continue;
    const d=defs[cell.type];if(!d)continue;
    if(d.produce)produce+=d.produce;
    if(d.attack)totalAttack+=d.attack;
    if(d.block){hasWallnut=true;cell.hp-=100;if(cell.hp<=0)c.garden.grid[r][col]=null;}
  }
  if(produce>0){c.sunlight.total+=produce;c.today.sunlight+=produce;c.logs.sunlight.unshift({time:nowISO(),action:'花园产出阳光',delta:produce,balance:c.sunlight.total});}
  // 普通攻击型植物：攻击第一只僵尸
  if(c.garden.zombies.length>0&&totalAttack>0){c.garden.zombies[0].hp-=totalAttack;if(c.garden.zombies[0].hp<=0)c.garden.zombies.shift();}
  if(d_settings().zombieEnabled){
    const rate=dailyRate(c);
    const tasks=todayTaskList(c);
    const doneCount=tasks.filter(t=>c.today.tasks[t.id]?.completed).length;
    if(rate<0.5&&!hasWallnut)c.garden.zombies.forEach(z=>{z.pos=Math.min(8,z.pos+1);});
    // 保底：当日完成任意2项任务，不再新增僵尸
    if(rate<0.3&&c.garden.zombies.length<5&&doneCount<2)c.garden.zombies.push(Store.newZombie());
  }
}

  validateName(name){
    if(!name||!name.trim())return'名称不能为空';
    const clean=name.replace(/[\u4e00-\u9fa5a-zA-Z0-9_]/g,'');
    if(clean.length>0)return'只能用汉字、字母、数字';
    const cn=(name.match(/[\u4e00-\u9fa5]/g)||[]).length;
    const en=(name.match(/[a-zA-Z0-9]/g)||[]).length;
    if(cn>8)return'最多8个汉字';
    if(cn===0&&en>12)return'字母数字最多12个字符';
    return'';
  },
  feed(petId){const c=curChild();const p=c.pets.find(x=>x.id===petId);if(!p||p.status==='dead')return;const def=this.list()[p.type];

  water(petId){const c=curChild();const p=c.pets.find(x=>x.id===petId);if(!p||p.status==='dead')return;
    if(!spendSunlight(5,'喂水'+p.name))return;
    p.satiety=clamp(p.satiety+5,0,200);p.lastFeedAt=Date.now();this.updateStatus(p);Log.pet('喂水',p.id,'饱食+5');Audio.play('pet');Store.save();UI.render();},
  touch(petId){const c=curChild();const p=c.pets.find(x=>x.id===petId);if(!p||p.status==='dead')return;
    if(!spendSunlight(10,'抚摸'+p.name))return;
    p.intimacy=clamp(p.intimacy+10,0,200);p.lastTouchAt=Date.now();this.updateStatus(p);Log.pet('抚摸',p.id,'亲密+10');Audio.play('pet');Store.save();UI.render();},
  walk(petId){const c=curChild();const p=c.pets.find(x=>x.id===petId);if(!p||p.status==='dead')return;
    if(!spendSunlight(10,'遛宠'+p.name))return;
    p.intimacy=clamp(p.intimacy+10,0,200);p.lastTouchAt=Date.now();this.updateStatus(p);Log.pet('遛宠',p.id,'亲密+10');Audio.play('pet');Store.save();UI.render();},
  heal(petId){const c=curChild();const p=c.pets.find(x=>x.id===petId);if(!p||p.status==='dead')return;
    const cost=this._healCost||150;
    if(!spendSunlight(cost,'治疗'+p.name))return;
    p.satiety=clamp(p.satiety+50,0,200);p.intimacy=clamp(p.intimacy+50,0,200);p.status='healthy';Log.pet('治疗',p.id,'恢复健康');Audio.play('pet');Store.save();},
  updateStatus(p){
    if(p.satiety<=0||p.intimacy<=0){p.status='dead';return;}
    if(p.satiety<=30||p.intimacy<50){p.status='sick';}
    else if(p.satiety<50){p.status='hungry';}
    else{p.status='healthy';}
  },
  // 每日衰减
  decay(c){
    if(!d_settings().petDecayEnabled)return;
    const ds=this._decaySat||30,di=this._decayInt||20;
    c.pets.forEach(p=>{
      if(p.status==='dead')return;
      p.satiety=Math.max(-1,p.satiety-ds);
      p.intimacy=Math.max(-1,p.intimacy-di);
      this.updateStatus(p);
      if(p.status==='dead'){c.logs.pet.unshift({time:nowISO(),action:'死亡',petId:p.id,detail:'属性耗尽'});}
    });
    // 清理死亡宠物
    c.pets=c.pets.filter(p=>p.status!=='dead');
  }
};

/* ============ DailyReset 模块 ============ */
function dailyRate(c){
  const tasks=todayTaskList(c);
  if(tasks.length===0)return 1;
  const done=tasks.filter(t=>c.today.tasks[t.id]?.completed).length;
  return done/tasks.length;
}
function todayTaskList(c){
  const grade=c.grade;const list=[];
  const hidden=new Set(d_settings().hiddenTasks||[]);
  // 语文
  if(Bank.chinese[grade]){
    list.push({id:'cn_pinyin',cat:'语文',name:'拼音测试',reward:10,perfectReward:10});
    // 识字任务（幼小衔接/低年级专属）
    if(Bank.characters[grade])list.push({id:'cn_literacy',cat:'语文',name:'识字测试',reward:10,perfectReward:10});
    // 语文生字默写（幼小衔接/低年级专属）
    if(Bank.characters[grade])list.push({id:'cn_dictation',cat:'语文',name:'生字默写',reward:10,perfectReward:10});
    list.push({id:'cn_callig',cat:'语文',name:'练字练习',reward:10,review:true});
    list.push({id:'cn_poetry',cat:'语文',name:'古诗背诵',reward:10,perfectReward:10});
    list.push({id:'cn_reading',cat:'语文',name:'课外阅读',reward:50,review:true});
  }
  // 数学
  list.push({id:'math_add',cat:'数学',name:'加法口算',reward:10,perfectReward:10});
  list.push({id:'math_sub',cat:'数学',name:'减法口算',reward:10,perfectReward:10});
  if(grade!=='gradeK'&&grade!=='grade1')list.push({id:'math_mul',cat:'数学',name:'乘法口算',reward:10,perfectReward:10});
  list.push({id:'math_think',cat:'数学',name:'思维训练',reward:10,perfectReward:10});
  // 英语
  if(Bank.english[grade]){
    list.push({id:'en_word',cat:'英语',name:'单词测试',reward:10,perfectReward:10});
    list.push({id:'en_dictation',cat:'英语',name:'单词听写',reward:10,perfectReward:10});
    list.push({id:'en_sent',cat:'英语',name:'短句测试',reward:10,perfectReward:10});
  }
  // 运动：每项独立打卡（sport_前缀）
  if(Bank.sports[grade])Bank.sports[grade].forEach((sp,si)=>list.push({id:'sport_'+si,cat:'运动',name:sp.name,icon:'🏃',reward:10,review:true,target:sp.target}));
  // 家务
  Bank.chores.forEach(ch=>list.push({id:ch.id,cat:'家务',name:ch.name,icon:ch.icon,reward:10,review:true}));
  // 作息德育
  Bank.deeds().forEach(d=>list.push({id:d.id,cat:'德育',name:d.name,icon:d.icon,reward:5,review:true}));
  // 家长自定义作业任务（按归属过滤：共有任务或当前孩子的专属任务）
  (Store.data.customTasks||[]).forEach(t=>{
    // scope='all' 或未设置 → 所有孩子可见
    // scope='child' → 只在 t.childId === 当前孩子ID 时可见
    if(t.scope==='child'&&t.childId&&t.childId!==d_settings().currentChildId)return;
    // 减分项目不计入作业完成率，单独在减分页面处理
    if(t.cat==='减分')return;
    list.push({id:t.id,cat:t.cat||'自定义',name:t.name,icon:t.icon||'📝',reward:t.reward,review:!!t.review,custom:true});
  });
  // 过滤被家长隐藏的内置任务
  return hidden.size?list.filter(t=>!hidden.has(t.id)):list;
}
function dailyReset(){
  const today=todayStr();
  if(d_settings().lastResetDate===today)return;
  Object.values(Store.data.children).forEach(c=>{
    // 连续打卡判定
    if(c.stats.lastActiveDate===d_settings().lastResetDate&&dailyRate(c)>=0.5){c.stats.streakDays++;}
    else if(dailyRate(c)<0.5){c.stats.streakDays=0;}
    // 心情归档
    if(c.today.mood){c.stats.moodHistory.push({date:d_settings().lastResetDate,mood:c.today.mood});if(c.stats.moodHistory.length>90)c.stats.moodHistory.shift();}
    // 错题本：将昨日错题标记为待复习
    c.wrongQuestions.forEach(wq=>{wq.retry=true;wq.answered=false;});
    // 花园结算（必须在清空任务前，用昨日完成率判定僵尸移动）
    gardenSettleFor(c);
    // 清空当日
    c.today={date:today,sunlight:0,tasks:{},quizRecords:{},mood:''};
    // 宠物衰减
    Pet.decay(c);
  });
  d_settings().lastResetDate=today;
  Store.save();
}

  importData(file){

        if(!data.children||!data.settings)throw new Error('格式错误');
        // 二次确认 + 模式选择

            <button class="btn danger sm" onclick="Sync._doImport(file,'cover')">⚠️ 覆盖导入（替换当前全部数据）</button>
            <button class="btn ghost sm" onclick="closeModal()">取消</button>
          </div></div>`,null,true);
        Sync._pendingFile=file;
      }catch(err){toast('导入失败：文件格式错误');}
    };
    reader.readAsText(file);
  },
  _pendingFile:null,
  _doImport(file,mode){
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const data=JSON.parse(e.target.result);
        if(mode==='cover'){
          Store.data=data;
        }else{
          // 合并：按孩子ID合并，新孩子直接加入
          Object.keys(data.children).forEach(cid=>{
            if(Store.data.children[cid]){
              // 已有则用备份覆盖（备份通常较新）
              Store.data.children[cid]=data.children[cid];
            }else{
              Store.data.children[cid]=data.children[cid];
            }
          });
          if(data.shopItems)Store.data.shopItems=data.shopItems;
          if(data.plantDefs)Store.data.plantDefs=data.plantDefs;
          if(data.petDefs)Store.data.petDefs=data.petDefs;
          if(data.achievementDefs)Store.data.achievementDefs=data.achievementDefs;
          if(data.deedDefs)Store.data.deedDefs=data.deedDefs;
          if(data.customTasks)Store.data.customTasks=data.customTasks;
        }
        Store.migrate();
        Object.values(Store.data.children).forEach(c=>Store.fixChild(c));
        Store.save();closeModal();UI.render();
        toast(mode==='cover'?'覆盖导入成功':'合并导入成功');
      }catch(err){toast('导入失败：'+err.message);}
    };
    reader.readAsText(Sync._pendingFile||file);
    Sync._pendingFile=null;
  }
};

/* ============ 任务完成/撤销 ============ */
function completeTask(taskId,reward,reason,perfect,bonus){
  const c=curChild();const t=c.today.tasks[taskId];
  if(t&&t.completed){toast('今日已完成，不可重复领取');return false;}
  const totalScore=reward+(bonus||0);
  const isQuiz=taskId.startsWith('cn_pinyin')||taskId.startsWith('cn_poetry')||taskId.startsWith('math_')||taskId.startsWith('en_')||taskId==='cn_literacy'||taskId==='cn_dictation';
  // 家长审核模式：非测试的需审核任务，孩子只能"申请审核"
  if(d_settings().reviewMode&&!isQuiz){
    const task=todayTaskList(c).find(x=>x.id===taskId);
    if(task&&task.review&&State.mode==='child'){
      if(t&&t.pendingReview){toast('已申请审核，请等家长确认');return false;}
      c.today.tasks[taskId]={pendingReview:true,applyAt:nowISO(),score:totalScore};
      Store.save();UI.render();toast('已申请审核，等待家长确认');
      return false;
    }
  }
  c.today.tasks[taskId]={completed:true,lockedAt:nowISO(),score:totalScore,base:reward,bonus:bonus||0,perfect:!!perfect};
  addSunlight(reward,reason);
  if(!isQuiz){Audio.play('checkin');}  // 打卡类任务播放打卡音效
  if(bonus){curChild().today.sunlight+=bonus;Log.sunlight(reason+'满分奖励',bonus);Store.save();}
  // 统计
  if(taskId==='cn_reading')c.stats.totalReading++;
  if(taskId.startsWith('math_')&&perfect){c.stats.perfectMathCount++;c.stats.totalPerfect++;}
  if(taskId.startsWith('sport_')){if(c.stats.lastSportDate!==todayStr()){c.stats.sportsDays++;c.stats.lastSportDate=todayStr();}}
  // 等级检查
  checkLevelUp();
  Ach.check();Store.save();UI.render();return true;
}
// 家长审核通过
function approveTask(taskId){
  const c=curChild();const t=c.today.tasks[taskId];
  if(!t||!t.pendingReview)return;
  const task=todayTaskList(c).find(x=>x.id===taskId);
  const reward=task?task.reward:10;
  c.today.tasks[taskId]={completed:true,lockedAt:nowISO(),score:reward,base:reward,bonus:0,perfect:false};
  addSunlight(reward,'审核通过：'+(task?task.name:taskId));
  Audio.play('checkin');
  checkLevelUp();Ach.check();Store.save();UI.render();
}
function rejectTask(taskId){
  const c=curChild();delete c.today.tasks[taskId];Store.save();UI.render();
}
// 等级体系
const Levels=[
  {name:'学童',min:0,emoji:'🌱'},
  {name:'小生',min:200,emoji:'🌿'},
  {name:'学子',min:500,emoji:'🍀'},
  {name:'学士',min:1000,emoji:'🌳'},
  {name:'小博士',min:2000,emoji:'🎓'}
];
function getLevel(sun){
  let lv=0;
  for(let i=0;i<Levels.length;i++){if(sun>=Levels[i].min)lv=i;}
  return lv;
}
function checkLevelUp(){
  const c=curChild();
  const total=c.sunlight.total;
  const newLv=getLevel(total);
  if(newLv>c.stats.level){
    c.stats.level=newLv;
    const def=Levels[newLv];
    toast('🎉 升级！你已成为"'+def.name+'"'+def.emoji);
    // 升级奖励：赠送限定植物（直接种到花园第一格）
    const gifts=['firepea','cherrybomb','snowpea','samoyed','tricolor'];
    const giftId=gifts[Math.min(newLv-1,gifts.length-1)];
    c.stats.levelGifts.push({level:newLv,gift:giftId,time:nowISO()});
    Audio.play('badge');
    showModal('🎉 恭喜升级！',`<div style="text-align:center;padding:20px;">
      <div style="font-size:60px;">${def.emoji}</div>
      <div style="font-size:22px;font-weight:700;margin:10px 0;">你已成为「${def.name}」！</div>
      <p style="color:var(--text-soft);">获得限定奖励：${giftId==='samoyed'||giftId==='tricolor'?'限定宠物皮肤':'限定植物'} 🎁</p>
      <p style="font-size:12px;color:var(--text-light);margin-top:8px;">去花园/宠物家园查看你的奖励吧～</p>
      </div>`,`<button class="btn sm" onclick="closeModal()">太棒了！</button>`);
  }
}
function undoTask(taskId){
  const c=curChild();const t=c.today.tasks[taskId];
  if(!t||!t.completed)return;
  // 退回阳光（Log.sunlight内部会扣减total并记日志）
  Log.sunlight('撤销：'+taskId,-t.score);
  c.today.sunlight=Math.max(0,c.today.sunlight-t.score);
  delete c.today.tasks[taskId];
  // 清除测试记录
  delete c.today.quizRecords[taskId];
  toast('已撤销，阳光已退回');
  Store.save();UI.render();
}

function showModal(title,body,footer='',noClose){
  const root=$('#modalRoot');
  const mask=document.createElement('div');mask.className='modal-mask';
  mask.innerHTML=`<div class="modal"><div class="modal-title"><span>${title}</span>${noClose?'':'<button class="modal-close" onclick="closeModal()">×</button>'}</div><div>${body}</div>${footer?`<div style="margin-top:14px;text-align:right;">${footer}</div>`:''}</div>`;
  mask.addEventListener('click',(e)=>{if(e.target===mask&&!noClose)closeModal();});
  root.appendChild(mask);
  window._curMask=mask;
  return mask;
}
function closeModal(){if(window._curMask){window._curMask.remove();window._curMask=null;}if(Shop.gameTimer){clearInterval(Shop.gameTimer);Shop.gameTimer=null;}}
// 全局朗读按钮事件委托：通过 data-speak 属性触发朗读，避免内联 onclick 转义问题
document.addEventListener('click',function(e){
  const btn=e.target.closest('[data-speak]');
  if(!btn)return;
  const txt=decodeURIComponent(btn.getAttribute('data-speak')||'');
  const lang=btn.getAttribute('data-lang')||'';
  if(txt)speak(txt,lang);
});
function confirmModal(msg,onYes){
  showModal('请确认',`<p style="margin:10px 0;font-size:14px;">${msg}</p>`,
    `<button class="btn ghost sm" onclick="closeModal()">取消</button> <button class="btn danger sm" id="cfYes">确定</button>`);
  setTimeout(()=>{const b=$('#cfYes');if(b)b.onclick=()=>{closeModal();onYes();};},0);
}

  uploadAvatar(input){
    const file=input.files[0];if(!file)return;
    if(file.size>2*1024*1024){toast('图片不能超过2MB');return;}
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        // 压缩到 96x96
        const canvas=document.createElement('canvas');
        canvas.width=96;canvas.height=96;
        const ctx=canvas.getContext('2d');
        // 居中裁剪
        const min=Math.min(img.width,img.height);
        const sx=(img.width-min)/2,sy=(img.height-min)/2;
        ctx.drawImage(img,sx,sy,min,min,0,0,96,96);
        const dataUrl=canvas.toDataURL('image/jpeg',0.85);
        curChild().profile.avatarImg=dataUrl;
        curChild().profile.avatar='📷';
        Store.save();closeModal();UI.render();toast('头像上传成功！');
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);

    }else if(id==='cn_reading'){
      btns=`<button class="btn sm" onclick="UI.showReading()">阅读书目</button> <button class="btn orange sm" onclick="completeTask('${id}',${reward},'课外阅读')">完成 +${reward}</button> <button class="btn ghost sm" onclick="UI.startFocus('${id}')">🎯</button>`;

    }else{

    }
    // 家长模式下显示删除按钮
    const delBtn=State.mode==='parent'?(isCustom?`<button class="btn danger sm" onclick="UI.delCustomTaskConfirm('${id}')" title="删除此自定义作业">🗑️ 删除</button>`:`<button class="btn ghost sm" style="color:var(--danger);font-size:11px;" onclick="UI.hideTask('${id}')" title="隐藏此内置作业">🚫 隐藏</button>`):'';

  },
  // 答题系统
  curQuiz:null,
  _quizOriginView:null,
  startQuiz(taskId){
    // 记录测试来源视图，退出时返回该页面
    this._quizOriginView=State.view;
    const c=curChild();const grade=c.grade;
    let questions=[];
    let title='';
    if(taskId==='cn_literacy'){
      const bank=Bank.characters[grade]||[];
      const chosen=pick(bank,Math.min(10,bank.length));
      // 一半看字选拼音，一半看拼音选字
      questions=chosen.map((w,i)=>{
        const distractors=shuffle(bank.filter(x=>x.char!==w.char)).slice(0,3);
        if(i%2===0){
          return{q:'"'+w.char+'"（'+w.word+'）的拼音是？',opts:shuffle([w.pinyin,...distractors.map(d=>d.pinyin)]),a:w.pinyin};
        }else{
          return{q:'拼音 "'+w.pinyin+'" 对应哪个字？',opts:shuffle([w.char,...distractors.map(d=>d.char)]),a:w.char};
        }
      });
      title='识字测试';
    }else if(taskId==='cn_pinyin'){
      const bank=Bank.chinese[grade]?.pinyin||[];
      questions=pick(bank,Math.min(10,bank.length)).map(q=>({q:q.q+' 读作？',opts:q.opts,a:q.a}));
      title='拼音测试';
    }else if(taskId==='cn_poetry'){
      const bank=Bank.chinese[grade]?.poetry||[];
      const p=pick(bank,Math.min(10,Math.max(1,bank.length)));
      // 一半作者题，一半填空题（用其他诗人名作干扰项）
      const allAuthors=['李白','杜甫','白居易','苏轼','王安石','陆游','杜牧','孟浩然','骆宾王','张继','刘禹锡','张志和'];
      questions=p.map((po,idx)=>{
        if(idx%2===0){
          return{q:'《'+po.title+'》的作者是？',opts:shuffle([po.author,...pick(allAuthors.filter(a=>a!==po.author),3)]),a:po.author};
        }else{
          const arr=po.content.replace(/[，。？！？]/g,'').split('');
          const ch=arr[rnd(arr.length)];
          return{q:'《'+po.title+'》中"'+ch+'"出自哪句？',opts:shuffle([po.content,...pick(bank.filter(x=>x.title!==po.title).map(x=>x.content),3).slice(0,3)]),a:po.content};
        }
      });
      title='古诗背诵测试';
    }else if(taskId==='math_add'){for(let i=0;i<10;i++)questions.push(Bank.mathGen.oralAdd(grade));title='加法口算';}
    else if(taskId==='math_sub'){for(let i=0;i<10;i++)questions.push(Bank.mathGen.oralSub(grade));title='减法口算';}
    else if(taskId==='math_mul'){for(let i=0;i<10;i++)questions.push(Bank.mathGen.mul(grade));title='乘法口算';}
    else if(taskId==='math_think'){for(let i=0;i<10;i++)questions.push(Bank.mathGen.thinking(grade));title='思维训练';}
    else if(taskId==='en_word'){
      const bank=Bank.english[grade]?.words||[];
      questions=pick(bank,Math.min(10,bank.length)).map(w=>({q:w.en+' ['+w.phonetic+'] 的意思是？',opts:shuffle([w.cn,...pick(bank.filter(x=>x.cn!==w.cn),3).map(x=>x.cn)]),a:w.cn,speakText:w.en,speakLang:'en-US'}));
      title='单词测试';
    }else if(taskId==='en_dictation'){
      // 英语听写：听读音，拼写英文单词
      const bank=Bank.english[grade]?.words||[];
      questions=pick(bank,Math.min(10,bank.length)).map(w=>({q:'🔊 听读音，拼写英文单词',a:w.en,speakText:w.en,speakLang:'en-US',dictation:true,hint:w.cn+' ['+w.phonetic+']'}));
      title='单词听写';
    }else if(taskId==='cn_dictation'){
      // 语文生字默写：听拼音读音，写汉字
      const bank=Bank.characters[grade]||[];
      questions=pick(bank,Math.min(10,bank.length)).map(w=>({q:'🔊 听读音，写出汉字',a:w.char,speakText:w.pinyin,speakLang:'zh-CN',dictation:true,hint:'组词：'+w.word}));
      title='生字默写';
    }else if(taskId==='en_sent'){
      const bank=Bank.english[grade]?.sentences||[];
      questions=pick(bank,Math.min(10,bank.length)).map(s=>({q:'"'+s.en+'" 的意思是？',opts:shuffle([s.cn,...pick(bank.filter(x=>x.cn!==s.cn),3).map(x=>x.cn)]),a:s.cn}));
      title='短句测试';
    }
    if(questions.length<10){toast('题库不足');}
    this.curQuiz={taskId,title,questions,answers:new Array(questions.length).fill(null),idx:0};
    this.renderQuiz();
  },
  renderQuiz(){
    const q=this.curQuiz;if(!q)return;
    // 关闭退出确认弹窗和旧测验弹窗（如果存在）
    if(this._quizMask){this._quizMask.remove();this._quizMask=null;}
    closeModal();
    const i=q.idx;const item=q.questions[i];
    const isInput=!item.opts;
    const answered=q.answers[i];
    const isDictation=!!item.dictation;
    const speakBtn=item.speakText?`<button class="btn sky sm" data-speak="${encodeURIComponent(item.speakText)}" data-lang="${item.speakLang||''}" title="点击朗读">🔊 朗读</button>`:'';
    // 低年级（幼小衔接/1/2年级）增加读题功能
    const grade=curChild().grade;
    const isLowGrade=(grade==='gradeK'||grade==='grade1'||grade==='grade2');
    // 读题语言：数学题强制中文（数字用中文读），其他按内容判断
    const readLang=item.speakLang||(q.taskId.startsWith('math_')?'zh-CN':(/[\u4e00-\u9fa5]/.test(item.q)?'zh-CN':'en-US'));
    // 读题按钮：朗读完整题干
    const readQBtn=isLowGrade&&!isDictation?`<button class="btn ghost sm" data-speak="${encodeURIComponent(item.q.replace(/["""]/g,''))}" data-lang="${readLang}" title="读题">📢 读题</button>`:'';
    let ansHtml='';
    if(isInput){
      ansHtml=`<input type="text" id="qInput" value="${answered||''}" placeholder="请输入答案" onkeydown="if(event.key==='Enter')UI.nextQuiz()">`;
    }else{
      // 低年级选择题：每个选项可朗读
      if(isLowGrade){
        ansHtml=`<div class="opt-grid">${item.opts.map(o=>{
          const oLang=/[\u4e00-\u9fa5]/.test(o)?'zh-CN':'en-US';
          return `<div style="display:flex;align-items:center;gap:2px;"><button class="opt-btn ${answered===o?'sel':''}" style="flex:1;" onclick="UI.selectQuiz('${o.replace(/'/g,"\\'")}')">${o}</button><button class="btn sky sm" style="padding:2px 4px;font-size:11px;min-width:28px;" data-speak="${encodeURIComponent(o)}" data-lang="${oLang}" title="朗读选项">🔊</button></div>`;
        }).join('')}</div>`;
      }else{
        ansHtml=`<div class="opt-grid">${item.opts.map(o=>`<button class="opt-btn ${answered===o?'sel':''}" onclick="UI.selectQuiz('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`;
      }
    }
    // 听写模式：题目区只显示朗读按钮+提示，不显示答案文字
    let qArea;
    if(isDictation){
      qArea=`<div style="text-align:center;padding:10px;"><div style="font-size:18px;font-weight:600;margin-bottom:10px;">${item.q}</div>${speakBtn}<div style="font-size:12px;color:var(--text-soft);margin-top:8px;">💡 提示：${item.hint||''}</div></div>`;
    }else{
      qArea=`<div class="quiz-q">${item.q} ${readQBtn} ${speakBtn}</div>`;
    }
    const body=`
      <div class="quiz-box">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-soft);">
          <span>第 ${i+1} / ${q.questions.length} 题</span>
          <span>已答 ${q.answers.filter(a=>a!==null).length} 题</span>
        </div>
        <div class="progress-bar" style="height:6px;"><div class="progress-fill" style="width:${(i+1)/q.questions.length*100}%;background:var(--sky);"></div></div>
        ${qArea}
        <div class="quiz-ans">${ansHtml}</div>
      </div>`;
    const footer=`
      <button class="btn ghost sm" onclick="UI.exitQuiz()">退出</button>
      <button class="btn ghost sm" onclick="UI.prevQuiz()" ${i===0?'disabled':''}>上一题</button>
      <button class="btn sm" onclick="UI.nextQuiz()">${i===q.questions.length-1?'提交测试':'下一题'}</button>`;
    showModal(q.title,body,footer,true);
    if(isInput)setTimeout(()=>{const inp=$('#qInput');if(inp){inp.focus();inp.oninput=(e)=>{this.curQuiz.answers[i]=e.target.value;};}},0);
    // 听写题自动朗读一次
    if(isDictation&&item.speakText){setTimeout(()=>speak(item.speakText,item.speakLang||''),300);}
    // 低年级非听写题自动读题一次（数学题用中文读数字）
    if(isLowGrade&&!isDictation){setTimeout(()=>speak(item.q.replace(/["""]/g,''),readLang),300);}
  },
  selectQuiz(opt){const q=this.curQuiz;q.answers[q.idx]=opt;this.renderQuiz();},
  exitQuiz(){
    // 直接显示退出确认弹窗（不用 confirmModal，避免覆盖 quiz modal 引用）
    const q=this.curQuiz;if(!q)return;
    const curTitle=q.title;
    // 保存当前 quiz 弹窗引用，以便 forceExitQuiz 能同时移除
    this._quizMask=window._curMask;
    const body=`<div style="padding:10px 0;text-align:center;font-size:14px;">确定要退出<span style="color:var(--primary-d);font-weight:700;">${curTitle}</span>吗？<br><span style="color:var(--text-soft);font-size:12px;">已答内容将不会保存。</span></div>`;
    const footer=`<button class="btn ghost sm" onclick="UI.renderQuiz()">继续答题</button> <button class="btn danger sm" onclick="UI.forceExitQuiz()">确认退出</button>`;
    showModal('退出确认',body,footer,true);
  },
  forceExitQuiz(){
    // 先移除测验弹窗（之前保存的引用）
    if(this._quizMask){this._quizMask.remove();this._quizMask=null;}
    this.curQuiz=null;closeModal();toast('已退出测试');this.backToQuizOrigin();
  },
  prevQuiz(){if(this.curQuiz.idx>0){this.curQuiz.idx--;this.renderQuiz();}},
  nextQuiz(){
    const q=this.curQuiz;
    if(q.answers[q.idx]===null||q.answers[q.idx]===''){toast('请先作答本题');return;}
    if(q.idx<q.questions.length-1){q.idx++;this.renderQuiz();return;}
    // 提交
    const unanswered=q.answers.filter(a=>a===null||a==='');
    if(unanswered.length>0){toast('还有'+unanswered.length+'题未作答，必须全部完成');return;}
    let correct=0;
    q.questions.forEach((item,i)=>{
      const a=String(q.answers[i]).trim();const b=String(item.a).trim();
      const ok=a===b||a.includes(b)||b.includes(a);
      if(ok)correct++;
      else{
        // 答错自动收录错题本
        curChild().wrongQuestions.push({id:uid(),subject:q.taskId.split('_')[0],q:item.q,a:item.a,userA:a,time:nowISO(),retry:false,answered:false});
      }
    });
    if(curChild().wrongQuestions.length>200)curChild().wrongQuestions=curChild().wrongQuestions.slice(-200);
    const total=q.questions.length;const perfect=correct===total;
    const task=todayTaskList(curChild()).find(t=>t.id===q.taskId);
    const reward=task.reward;
    let bonus=0;let msg=`测试完成！答对 ${correct}/${total} 题。`;
    if(perfect&&task.perfectReward){bonus=task.perfectReward;msg+=`\n满分全对！额外+${bonus}阳光`;}
    if(correct<total)msg+=`\n答错的题目已加入错题本，次日可复习。`;
    Audio.play(perfect?'correct':'wrong');
    completeTask(q.taskId,reward,q.title+(perfect?'（满分）':''),perfect,perfect?bonus:0);
    // 清理测验弹窗引用
    if(this._quizMask){this._quizMask.remove();this._quizMask=null;}
    closeModal();
    this.curQuiz=null;
    const originView=this._quizOriginView||'dashboard';
    showModal('测试结果',`<div style="text-align:center;padding:20px;"><div style="font-size:50px;">${perfect?'🎉':'💪'}</div><div style="font-size:20px;font-weight:700;margin:10px 0;">${correct} / ${total}</div><p style="color:var(--text-soft);white-space:pre-line;">${msg}</p><p style="margin-top:10px;color:var(--primary-d);font-weight:700;">获得 ${reward+bonus} 阳光 ☀️</p></div>`,`<button class="btn sm" onclick="UI.backToQuizOrigin()">好的</button>`);
  },
  backToQuizOrigin(){
    // 清理所有弹窗
    if(this._quizMask){this._quizMask.remove();this._quizMask=null;}
    closeModal();
    const root=$('#modalRoot');
    if(root)root.innerHTML='';
    if(this._quizOriginView){State.view=this._quizOriginView;}
    this._quizOriginView=null;
    UI.render();
  },

  showReading(){

    showModal('课外阅读',`<div><p style="font-size:12px;color:var(--text-soft);margin-bottom:10px;">每日阅读打卡，完成可得50阳光！</p><div class="grid grid-3">${books.map(b=>`<div class="task-card"><div class="t-title">📚</div><div class="t-desc"><b>${b.book}</b><br>${b.author}</div></div>`).join('')}</div></div>`,null);
  },
  renderGarden(){
    const c=curChild();const defs=Garden.plantList();
    // 计算僵尸在网格中的列位置（从右侧第1列开始向左排）
    const zombiesByPos={};
    c.garden.zombies.forEach((z,idx)=>{
      const col=8-(z.pos||0); // pos=0 -> col=8（最右列），pos越大越靠左
      const row=z.row!==undefined?z.row:idx%5; // 僵尸自己的行（0-4），否则分散
      if(!zombiesByPos[col])zombiesByPos[col]=[];
      zombiesByPos[col].push({z,row});
    });
    let gridHtml='';
    for(let r=0;r<5;r++){for(let col=0;col<9;col++){
      const cell=c.garden.grid[r][col];
      const def=cell?defs[cell.type]:null;
      // 植物渲染：有图片用图片，否则用emoji
      let plantHtml='';
      if(cell&&def){
        plantHtml=def.img?`<img src="${def.img}" class="cell-plant-img" alt="${def.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span class="cell-plant-emoji" style="display:none;">${def.emoji}</span>`:`<span class="cell-plant-emoji">${def.emoji}</span>`;
      }
      // 检查该格是否有僵尸
      let zombieInCell='';
      if(zombiesByPos[col]){
        const zm=zombiesByPos[col].find(x=>x.row===r);
        if(zm){
          const z=zm.z;
          const zombieImg=z.img?`<img src="${z.img}" class="cell-zombie-img" alt="僵尸" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><span style="display:none;font-size:20px;">🧟</span>`:`<span style="font-size:20px;">🧟</span>`;
          zombieInCell=`<div class="cell-zombie" onclick="event.stopPropagation();UI.zombieInfo('${z.id}')" title="${z.intro||'点击查看僵尸详情'}">${zombieImg}<div class="z-bar"><i style="width:${z.hp/z.maxHp*100}%"></i></div></div>`;
        }
      }
      gridHtml+=`<div class="cell ${cell?'has-plant':''}" onclick="UI.clickCell(${r},${col})" onmouseover="UI.cellTip(${r},${col},event)" onmouseout="UI.hideTip()">${plantHtml}${zombieInCell}</div>`;
    }}

  _shopSelectedType:null,
  shopPlant(type){
    const def=Garden.plantList()[type];if(!def)return;
    const c=curChild();
    if(c.sunlight.total<def.cost){toast('阳光不足，需要 '+def.cost+'☀️');return;}
    // 检查是否有空格
    let emptyCount=0;
    for(let r=0;r<5;r++)for(let col=0;col<9;col++)if(!c.garden.grid[r][col])emptyCount++;
    if(emptyCount===0){toast('花园已满，请先移除植物');return;}
    this._shopSelectedType=type;
    toast('🌱 已选中 '+def.name+'，点击花园格子种植');
    UI.render();

  clickCell(r,col){
    const c=curChild();const cell=c.garden.grid[r][col];
    // 如果已从商店选中植物，直接种植
    if(this._shopSelectedType&&!cell){
      const type=this._shopSelectedType;
      const def=Garden.plantList()[type];
      if(def&&c.sunlight.total>=def.cost){
        if(Garden.plant(r,col,type)){
          toast('🌱 '+def.name+' 种植成功！');
          this._shopSelectedType=null;
          UI.render();
        }else{
          toast('种植失败');
        }
        return;
      }
    }
    if(cell){
      // 撤销种植
      const def=Garden.plantList()[cell.type];
      confirmModal('确定移除'+def.name+'？'+(c.garden.undoFree?'（首次免费）':'（扣10阳光）'),()=>{if(Garden.remove(r,col)){toast('已移除'+def.name);UI.render();}});

      // 选择植物
      const defs=Garden.plantList();
      const opts=Object.entries(defs).map(([k,d])=>`<button class="btn sm ${Garden.canPlant(k)?'':'done'}" ${Garden.canPlant(k)?'':'disabled'} onclick="UI.doPlant(${r},${col},'${k}')">${d.emoji} ${d.name} (${d.cost}☀️)</button>`).join('');
      showModal('选择植物',`<div style="display:flex;flex-direction:column;gap:6px;">${opts}</div>`);
    }

      <div class="card"><div class="card-title">🏅 ${month}月成长证书</div>
        <div style="${certStyle}">
          <div style="font-size:14px;color:var(--text-soft);">荣誉证书</div>

            <input type="text" value="${t.icon||'📝'}" style="width:40px;border:1px solid var(--border);border-radius:4px;padding:2px;text-align:center;" onchange="Store.data.customTasks.find(x=>x.id==='${t.id}').icon=this.value;Store.save()">
            <input type="text" value="${t.name}" style="width:100px;border:1px solid var(--border);border-radius:4px;padding:2px;" onchange="Store.data.customTasks.find(x=>x.id==='${t.id}').name=this.value;Store.save()">
            <select style="border:1px solid var(--border);border-radius:4px;padding:2px;" onchange="Store.data.customTasks.find(x=>x.id==='${t.id}').cat=this.value;Store.save()">
              ${['语文','数学','英语','运动','家务','德育','减分'].map(c=>`<option value="${c}" ${t.cat===c?'selected':''}>${c}</option>`).join('')}
            </select>
            <select style="border:1px solid var(--border);border-radius:4px;padding:2px;font-size:11px;" onchange="UI.setCustomTaskScope('${t.id}',this.value)">
              <option value="all" ${t.scope!=='child'?'selected':''}>🌐 共有</option>
              ${Object.entries(Store.data.children).map(([cid,ch])=>`<option value="${cid}" ${t.scope==='child'&&t.childId===cid?'selected':''}>${ch.profile.name}专属</option>`).join('')}
            </select>
            <input type="number" value="${t.reward}" style="width:50px;border:1px solid var(--border);border-radius:4px;padding:2px;" onchange="Store.data.customTasks.find(x=>x.id==='${t.id}').reward=+this.value||10;Store.save()">☀️
            <label style="font-size:11px;"><input type="checkbox" ${t.review?'checked':''} onchange="Store.data.customTasks.find(x=>x.id==='${t.id}').review=this.checked;Store.save()"> 审核</label>
          </span>
          <button class="btn danger sm" onclick="UI.delCustomTask('${t.id}')">删除</button>
        </div>`;}).join('')||'<div style="color:var(--text-light);text-align:center;padding:10px;font-size:12px;">暂无自定义作业</div>'}
        <div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;">
          <div style="font-size:12px;font-weight:600;margin-bottom:6px;">➕ 添加新作业任务</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
            <input id="newCtIcon" placeholder="图标" value="📝" style="width:50px;padding:6px;border:1px solid var(--border);border-radius:6px;text-align:center;">
            <input id="newCtName" placeholder="任务名称（如：写日记）" style="flex:1;min-width:100px;padding:6px;border:1px solid var(--border);border-radius:6px;">
            <select id="newCtCat" style="padding:6px;border:1px solid var(--border);border-radius:6px;">
              ${['语文','数学','英语','运动','家务','德育','减分'].map(c=>`<option value="${c}">${c}</option>`).join('')}
            </select>
            <select id="newCtScope" style="padding:6px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
              <option value="all">🌐 共有任务</option>
              ${Object.entries(Store.data.children).map(([cid,ch])=>`<option value="${cid}">${ch.profile.name}专属</option>`).join('')}
            </select>
            <input id="newCtReward" type="number" placeholder="阳光" value="10" style="width:55px;padding:6px;border:1px solid var(--border);border-radius:6px;">
            <label style="font-size:11px;display:flex;align-items:center;gap:2px;"><input type="checkbox" id="newCtReview"> 需审核</label>
            <button class="btn sm" onclick="UI.addCustomTask()">添加</button>
          </div>
        </div>
      </div>
      <div class="card"><div class="card-title">🏆 徽章管理</div>${Store.data.achievementDefs.map(a=>`<div class="log-item"><span>${a.icon} <input type="text" value="${a.name}" style="width:80px;border:1px solid var(--border);border-radius:4px;padding:2px;" onchange="Store.data.achievementDefs.find(x=>x.id==='${a.id}').name=this.value;Store.save()"> <input type="text" value="${a.cond}" style="width:120px;border:1px solid var(--border);border-radius:4px;padding:2px;" onchange="Store.data.achievementDefs.find(x=>x.id==='${a.id}').cond=this.value;Store.save()"></span><button class="btn danger sm" onclick="UI.delBadge('${a.id}')">删除</button></div>`).join('')}
        <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;"><input id="newBadgeName" placeholder="名称"><input id="newBadgeCond" placeholder="解锁条件"><input id="newBadgeIcon" placeholder="图标" value="🎖️"><button class="btn sm" onclick="UI.addBadge()">添加</button></div>
      </div>
      <div class="card"><div class="card-title">🌱 植物数值</div>${Object.entries(Store.data.plantDefs).map(([k,d])=>`<div class="log-item"><span>${d.emoji} ${d.name}</span><span>攻击<input type="number" style="width:60px;" value="${d.attack}" onchange="Store.data.plantDefs['${k}'].attack=+this.value;Store.save()"> 产出<input type="number" style="width:60px;" value="${d.produce}" onchange="Store.data.plantDefs['${k}'].produce=+this.value;Store.save()"></span></div>`).join('')}</div>
      <div class="card"><div class="card-title">🐾 宠物衰减数值</div>
        <div class="log-item"><span>每日饱食度衰减</span><input type="number" style="width:60px;" value="30" onchange="Pet._decaySat=+this.value;Store.save()"></div>
        <div class="log-item"><span>每日亲密度衰减</span><input type="number" style="width:60px;" value="20" onchange="Pet._decayInt=+this.value;Store.save()"></div>
        <div class="log-item"><span>生病治疗费用</span><input type="number" style="width:60px;" value="150" onchange="Pet._healCost=+this.value;Store.save()"></div>
        <p style="font-size:12px;color:var(--text-soft);margin-top:6px;">修改后次日生效。当前：饱食-${Pet._decaySat||30} 亲密-${Pet._decayInt||20} 治疗${Pet._healCost||150}阳光</p>
      </div>
      <div class="card"><div class="card-title">💾 数据管理</div>
        <button class="btn sm" onclick="Sync.showExport()">📤 导出数据</button>
        <button class="btn sm" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
        <input type="file" id="importFile" style="display:none;" accept=".json" onchange="Sync.importData(this.files[0])">
        <p style="font-size:12px;color:var(--text-soft);margin-top:8px;">⚠️ 建议定期备份，清理浏览器缓存会丢失本地数据。<br>导出支持单孩子/全部孩子；导入支持合并/覆盖两种模式。跨设备迁移学习档案请用导出导入。</p>
      </div>`;
  },
  // 家长操作方法
  switchChild(id){d_settings().currentChildId=id;Store.save();UI.render();},
  // 阳光补偿/调整（dir=1增加, dir=-1减少）
  adjustSunlight(dir){
    const c=curChild();
    const amount=parseInt($('#adjSunAmount')?.value||'0');
    if(!amount||amount<=0){toast('请输入有效数量');return;}
    const reason=($('#adjSunReason')?.value||'').trim()||'家长调整';
    const actual=dir>0?amount:-amount;
    if(dir<0&&c.sunlight.total<amount){
      toast('余额不足（当前'+c.sunlight.total+'），将扣至0');
    }
    Log.sunlight(reason,actual);
    if(dir>0)c.today.sunlight+=amount;
    Store.save();UI.render();
    toast((dir>0?'➕ 已增加':'➖ 已减少')+' '+amount+' 阳光：'+reason);
  },
  // 直接设置阳光余额
  setSunlightDirect(){
    const c=curChild();
    const amount=parseInt($('#adjSunAmount')?.value||'0');
    if(isNaN(amount)||amount<0){toast('请输入有效数量');return;}
    const reason=($('#adjSunReason')?.value||'').trim()||'家长设置';
    const old=c.sunlight.total;
    c.sunlight.total=amount;
    c.logs.sunlight.unshift({time:nowISO(),action:reason+'（'+old+'→'+amount+'）',delta:amount-old,balance:amount});
    Store.save();UI.render();
    toast('✏️ 阳光余额已设置为 '+amount+'（原 '+old+'）');
  },
  // 孩子切换菜单（孩子模式也能用）
  switchChildMenu(){
    const children=Store.data.children;
    const curId=d_settings().currentChildId;
    const items=Object.entries(children).map(([id,ch])=>{
      const av=ch.profile.avatarImg?`<img src="${ch.profile.avatarImg}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">`:(ch.profile.avatar||'🙂');
      return `<button class="btn ${id===curId?'':'ghost'} sm" style="margin:2px;font-size:13px;" onclick="UI.switchChild('${id}');closeModal()">${av} ${ch.profile.name}${id===curId?' ✓':''}</button>`;
    }).join('');
    const body=`<div style="text-align:center;padding:10px 0;"><p style="font-size:13px;color:var(--text-soft);margin-bottom:10px;">选择当前宝贝</p><div style="display:flex;flex-direction:column;gap:4px;align-items:center;">${items}</div></div>`;
    showModal('切换宝贝',body,`<button class="btn ghost sm" onclick="closeModal()">关闭</button>`,false);
  },
  addChild(){
    const name=prompt('孩子姓名：');if(!name)return;
    const id='c_'+uid();
    Store.data.children[id]={profile:{name,avatar:'🙂',grade:'grade1'},grade:'grade1',today:{date:todayStr(),sunlight:0,tasks:{},quizRecords:{},mood:''},sunlight:{total:300},garden:{grid:Store.emptyGrid(),zombies:[Store.newZombie()],undoFree:true},pets:[],achievements:[],logs:{sunlight:[],pet:[]},wrongQuestions:[],stats:{streakDays:0,lastActiveDate:'',lastSportDate:'',totalReading:0,perfectMathCount:0,totalPerfect:0,sportsDays:0,focusMinutes:0,level:0,levelGifts:[],moodHistory:[]}};
    Store.fixChild(Store.data.children[id]);
    d_settings().currentChildId=id;Store.save();UI.render();toast('已添加孩子');
  },
  delChild(){
    if(Object.keys(Store.data.children).length<=1){toast('至少保留一个孩子');return;}
    confirmModal('确定删除'+curChild().profile.name+'？所有数据将丢失。',()=>{delete Store.data.children[d_settings().currentChildId];d_settings().currentChildId=Object.keys(Store.data.children)[0];Store.save();UI.render();});
  },
  setGrade(g){const c=curChild();c.grade=g;c.profile.grade=g;c.today={date:todayStr(),sunlight:0,tasks:{},quizRecords:{}};Store.save();toast('年级已切换，任务已刷新');UI.render();},
  saveSettings(){
    d_settings().parentPassword=$('#cfgPwd').value||'8888';
    d_settings().zombieEnabled=$('#cfgZombie').checked;
    d_settings().petDecayEnabled=$('#cfgDecay').checked;
    d_settings().reviewMode=$('#cfgReview')?.checked||false;
    Store.save();toast('设置已保存');
  },
  addDeed(){
    const name=$('#newDeedName').value.trim();const icon=$('#newDeedIcon').value||'✨';
    if(!name){toast('请填写名称');return;}
    Store.data.deedDefs.push({id:'deed_'+uid(),name,icon});
    Store.save();UI.render();
  },
  delDeed(id){Store.data.deedDefs=Store.data.deedDefs.filter(x=>x.id!==id);Store.save();UI.render();},
  addCustomTask(){
    // 兼容家长管理页面的表单（带 #newCtName 等元素）
    const nameEl=$('#newCtName');
    if(nameEl){
      const name=nameEl.value.trim();
      if(!name){toast('请填写任务名称');return;}
      const icon=$('#newCtIcon')?.value||'📝';
      const cat=$('#newCtCat')?.value||'自定义';
      const reward=+$('#newCtReward')?.value||10;
      const review=$('#newCtReview')?.checked||false;
      // scope: 'all'（共有）或 childId（某孩子专属）
      const scopeVal=$('#newCtScope')?.value||'all';
      const scope=scopeVal==='all'?'all':'child';
      const childId=scopeVal==='all'?null:scopeVal;
      if(!Store.data.customTasks)Store.data.customTasks=[];
      Store.data.customTasks.push({id:'ct_'+uid(),name,icon,cat,reward,review,custom:true,scope,childId});
      Store.save();UI.render();toast('已添加'+(scope==='all'?'共有':'专属')+'作业：'+name);
      return;
    }
  },
  // 修改已有任务的归属范围
  setCustomTaskScope(taskId,val){
    const t=Store.data.customTasks.find(x=>x.id===taskId);if(!t)return;
    if(val==='all'){t.scope='all';t.childId=null;}
    else{t.scope='child';t.childId=val;}
    Store.save();UI.render();
  },
  // 科目页面底部的迷你添加表单（家长模式专用）
  addCustomTaskInline(cat){
    const nameEl=$('#inlineCtName');
    if(!nameEl)return;
    const name=nameEl.value.trim();
    if(!name){toast('请填写任务名称');return;}
    const icon=$('#inlineCtIcon')?.value||'📝';
    const reward=+$('#inlineCtReward')?.value||10;
    const review=$('#inlineCtReview')?.checked||false;
    const scopeVal=$('#inlineCtScope')?.value||'all';
    const scope=scopeVal==='all'?'all':'child';
    const childId=scopeVal==='all'?null:scopeVal;
    if(!Store.data.customTasks)Store.data.customTasks=[];
    Store.data.customTasks.push({id:'ct_'+uid(),name,icon,cat,reward,review,custom:true,scope,childId});
    Store.save();UI.render();toast(`已添加${scope==='all'?'共有':'专属'}${cat}作业：${name}（+${reward}☀️）`);
  },
  delCustomTask(id){
    Store.data.customTasks=(Store.data.customTasks||[]).filter(x=>x.id!==id);
    // 同时清除各孩子当日该任务的完成记录
    Object.values(Store.data.children).forEach(c=>{if(c.today&&c.today.tasks)delete c.today.tasks[id];});
    Store.save();UI.render();
  },
  // 删除自定义作业（带确认）
  delCustomTaskConfirm(id){
    const t=(Store.data.customTasks||[]).find(x=>x.id===id);
    const name=t?t.name:'该任务';
    confirmModal('确定删除「'+name+'」？已完成的记录也会清除。',()=>{this.delCustomTask(id);toast('已删除：'+name);});
  },
  // 隐藏内置作业（不删除定义，只从列表中隐藏）
  hideTask(id){
    const t=todayTaskList(curChild()).find(x=>x.id===id);
    const name=t?t.name:id;
    confirmModal('确定隐藏「'+name+'」？隐藏后孩子不再看到此任务。可在家长模式→系统设置中恢复。',()=>{
      if(!d_settings().hiddenTasks)d_settings().hiddenTasks=[];
      if(!d_settings().hiddenTasks.includes(id))d_settings().hiddenTasks.push(id);
      Store.save();UI.render();toast('已隐藏：'+name);
    });
  },
  // 恢复隐藏的内置任务
  restoreTask(id){
    d_settings().hiddenTasks=(d_settings().hiddenTasks||[]).filter(x=>x!==id);
    Store.save();UI.render();toast('已恢复任务');
  },
  approveChild(cid,tid){d_settings().currentChildId=cid;approveTask(tid);},
  rejectChild(cid,tid){const ch=Store.data.children[cid];if(ch&&ch.today.tasks[tid]){delete ch.today.tasks[tid];}Store.save();UI.render();toast('已驳回');},
  addShop(){
    const name=$('#newShopName').value.trim();const price=+$('#newShopPrice').value;const icon=$('#newShopIcon').value||'🎁';
    if(!name||!price){toast('请填写名称和价格');return;}
    Store.data.shopItems.push({id:uid(),name,icon,price,action:'custom'});
    Store.save();UI.render();
  },
  delShop(id){Store.data.shopItems=Store.data.shopItems.filter(x=>x.id!==id);Store.save();UI.render();},
  addBadge(){
    const name=$('#newBadgeName').value.trim();const cond=$('#newBadgeCond').value.trim();const icon=$('#newBadgeIcon').value||'🎖️';
    if(!name){toast('请填写名称');return;}
    Store.data.achievementDefs.push({id:uid(),name,icon,cond:cond||'自定义',custom:true});
    Store.save();UI.render();
  },
  delBadge(id){Store.data.achievementDefs=Store.data.achievementDefs.filter(x=>x.id!==id);curChild().achievements=curChild().achievements.filter(a=>a.id!==id);Store.save();UI.render();}
};

/* ============ App 全局对象 ============ */
const App = {
  toggleMode(){
    if(State.mode==='child'){
      // 进入家长模式需密码
      showModal('家长密码',`<div style="text-align:center;padding:10px;"><p style="margin-bottom:10px;">请输入家长密码</p><input type="password" id="pwdInput" style="padding:10px;border:2px solid var(--border);border-radius:8px;font-size:16px;text-align:center;width:160px;" onkeydown="if(event.key==='Enter')App.checkPwd()"></div>`,
        `<button class="btn ghost sm" onclick="closeModal()">取消</button> <button class="btn sm" onclick="App.checkPwd()">进入</button>`,true);
      setTimeout(()=>$('#pwdInput')?.focus(),50);
    }else{
      State.mode='child';State.view='dashboard';UI.render();
    }
  },
  checkPwd(){
    const v=$('#pwdInput').value;
    if(v===d_settings().parentPassword){State.mode='parent';State.view='parent';closeModal();UI.render();toast('已进入家长模式');}
    else{toast('密码错误');}
  }
};

/* ============ Init ============ */
function init(){
  Store.load();
  Sync.init();
  dailyReset();
  // 更新lastActiveDate
  const c=curChild();
  if(c.stats.lastActiveDate!==todayStr()){c.stats.lastActiveDate=todayStr();Store.save();}
  UI.render();
  // 首次交互激活音频
  document.addEventListener('click',()=>Audio.init(),{once:true});
}
init();

// 暴露到全局
window.App=App;window.UI=UI;window.Router=Router;window.Store=Store;
window.closeModal=closeModal;window.completeTask=completeTask;window.undoTask=undoTask;
window.approveTask=approveTask;window.rejectTask=rejectTask;window.checkLevelUp=checkLevelUp;
window.Pet=Pet;window.Garden=Garden;window.Shop=Shop;window.Sync=Sync;window.Bank=Bank;window.Levels=Levels;window.speak=speak;

})();
</script>
